<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/main.css" />

<div class="wrapper">
    <header>
        <div class="header-container">
            <div class="header-logo">
                <a href="#hero" class="logo-link">
                    <div class="logo-img">
                        <img src="./assets/images/snowflake.svg" alt="Red snowflake" />
                    </div>
                </a>
                <span class="logo-text">the gifts</span>
            </div>
            <div class="header-nav">
                <ul class="nav-list">
                    <li class="nav-list-items"><a href="#gifts">gifts</a></li>
                    <li class="nav-list-items"><a href="#about">about</a></li>
                    <li class="nav-list-items"><a href="#">best</a></li>
                    <li class="nav-list-items"><a href="#contact">contact</a></li>
                </ul>
            </div>
        </div>
    </header>
    <main>
    <section id="gift" class="gift">
        <div class="gift-container">

        </div>
    </section>
    </main>
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-content">
                <div id="contact" class="footer-contact">
                    <div class="contact-img">
                        <img src="./assets/images/santa-claus.svg" alt="santa claus" />
                    </div>
                    <span class="contact-description" >+375 (29) 111-22-33</span>
                    <a class="contact-link" href="tel:+375291112233">call us</a>
                </div>
                <div class="footer-location">
                    <div class="contact-img">
                        <img src="./assets/images/christmas-tree.svg" alt="santa claus" />

                    <a class="contact-link" href="https://maps.app.goo.gl/cEBihNpUDZhYzPSbA" target="_blank" rel="noopener noreferrer">meet us</a>
                </div>
            </div>
            <div class="footer-gmail">
                <div class="contact-img">
                    <img src="./assets/images/snake.svg" alt="christmas tree" />
                </div>
                <span class="contact-description" >gifts@magic.com</span>
                <a class="contact-link" href="mailto:gifts@magic.com">write us</a>
            </div>

        <div class="footer-media">
            <div class="socials-media">
                <div class="socials-media-icons">
                    <img src="./assets/images/telegram.png" alt="telegram">
                </div>
                <div class="socials-media-icons">
                    <img src="./assets/images/facebook.png" alt="facebook">
                </div>
                <div class="socials-media-icons">
                    <img src="./assets/images/instagram.png" alt="instagram">
                </div>
                <div class="socials-media-icons">

            <span class="school-link"><a href="https://rs.school/" target="_blank">Made in Rolling Scopes School</a></span>
