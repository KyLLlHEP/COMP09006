<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task planer</title>
    <link rel="stylesheet" href="styles.css">
<!--    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>-->
</head>
<body>
<form id="task-form">
    <label for="task-name">Task Name:</label>
    <input type="text" id="task-name" name="task-name" placeholder="Enter task name" required />

    <label for="task-priority">Priority:</label>
    <select id="task-priority" name="task-priority" required>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
    </select>

    <label for="task-date">Due Date:</label>
    <input type="date" id="task-date" name="task-date" required />

    <button type="submit">Add Task</button>
</form>

<button id="sort-priority">Sort by Priority</button>
<button id="sort-date">Sort by Due Date</button>
<button id="remove-completed">Remove Completed</button>

<ul id="task-list"></ul>
</body>
<script src="todojs.js"></script>
</html>
